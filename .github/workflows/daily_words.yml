name: Daily French Words Bot

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: python:3.11-slim
    steps:
      - uses: actions/checkout@v3

      # 1. התקנת Git בתוך ה-Container הרזה
      - name: Install Git
        run: |
          apt-get update
          apt-get install -y git

      # 2. התקנת ספריית פייתון
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai python-telegram-bot

      # 3. הרצת הסקריפט
      - name: Run words script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python words_main.py

      # 4. שמירה ועדכון ה-History
      - name: Commit and push updated history
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add words_history.json
          git commit -m "Update words history [skip ci]" || echo "No changes to commit"
          git push
